name: Build Windows tester app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Set local plotting cache
        shell: pwsh
        run: '"MPLCONFIGDIR=$env:RUNNER_TEMP/tqec-matplotlib" | Out-File -FilePath $env:GITHUB_ENV -Append'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install pyinstaller==6.22.3
      - run: python -m PyInstaller --noconfirm --clean packaging/windows/studio.spec
      - name: Test the frozen executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'frozen-smoke.json'
          $process = Start-Process -FilePath 'dist/TQEC Studio/TQEC Studio.exe' -ArgumentList @('--smoke-test', $report) -PassThru
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Frozen application test timed out'
          }
          if (-not (Test-Path $report)) { throw 'Frozen test produced no report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw $result.error }
          Copy-Item $report 'dist/TQEC Studio/build-check.json'
      - name: Collect third-party licence texts
        run: python scripts/collect_licenses.py --output "dist/TQEC Studio/third_party_licenses" --include-runtime
      - name: Package for testers
        shell: pwsh
        run: |
          Copy-Item 'packaging/windows/START-HERE.txt' 'dist/TQEC Studio/START-HERE.txt'
          Copy-Item 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md' 'dist/TQEC Studio/'
          New-Item -ItemType Directory -Path 'tester-download' | Out-Null
          Compress-Archive -Path 'dist/TQEC Studio' -DestinationPath 'tester-download/TQEC-Studio-Windows-Testers.zip'
          (Get-FileHash 'tester-download/TQEC-Studio-Windows-Testers.zip' -Algorithm SHA256).Hash | Set-Content 'tester-download/TQEC-Studio-Windows-Testers.zip.sha256'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TQEC-Studio-Windows-Testers
          path: tester-download/*
          retention-days: 14
