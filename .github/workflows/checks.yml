name: Review checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Set local plotting cache
        run: echo "MPLCONFIGDIR=$RUNNER_TEMP/tqec-matplotlib" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install ruff==0.16.9 build==1.6.1 pip-audit==2.10.1
      - run: python -m pip check
      - run: ruff check studio tests scripts run_studio.py
      - run: ruff format --check studio tests scripts run_studio.py
      - run: for file in studio/static/*.js; do node --check "$file"; done
      - run: node --test tests/*.cjs
      - run: python -m unittest discover -s tests -v
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: python -m build
      - run: python scripts/export_review.py --output "${{ runner.temp }}/tqec-studio-review.zip"
